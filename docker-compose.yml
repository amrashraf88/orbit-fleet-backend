services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orbit_fleet
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit_dev_password
    ports:
      - "5433:5432"
    volumes:
      - orbit_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit_fleet"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - orbit_redis:/data

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://orbit:orbit_dev_password@postgres:5432/orbit_fleet?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  orbit_postgres:
  orbit_redis:
